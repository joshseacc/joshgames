<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極速時間賽車手 - 數學應用題版</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'PingFang HK', 'Microsoft JhengHei', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #111827; /* 深邃賽道黑 */
      background-image: radial-gradient(#1f2937 1px, transparent 1px);
      background-size: 20px 20px;
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    
    /* 賽車格仔旗邊框 */
    .checkered-border {
      border: 6px solid transparent;
      border-image: repeating-linear-gradient(45deg, #111827 0, #111827 15px, #f3f4f6 15px, #f3f4f6 30px) 8;
    }

    /* 維修站警告條紋 - 調暗 */
    .pitstop-border {
      background: repeating-linear-gradient(
        -45deg,
        #b45309,
        #b45309 10px,
        #1f2937 10px,
        #1f2937 20px
      );
    }

    /* 火焰漸變字體 */
    .flame-text {
      background: linear-gradient(to bottom, #fde047 0%, #f97316 50%, #dc2626 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 2px rgba(220, 38, 38, 0.5));
    }

    /* 霓虹發光數字 - 調弱發光效果 */
    .neon-text {
      color: #38bdf8;
      text-shadow: 0 0 3px #0ea5e9;
    }

    .car-slide {
      transition: left 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 賽車主題 SVG 圖標 ---
    const IconCar = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="none" className={className}><path d="M14 6l-3-4H4L1 8v7h3c0 1.66 1.34 3 3 3s3-1.34 3-3h4c0 1.66 1.34 3 3 3s3-1.34 3-3h3V8h-3l-3-2z"/><circle cx="7" cy="15" r="1" fill="#fff"/><circle cx="17" cy="15" r="1" fill="#fff"/></svg>
    );
    const IconFlag = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
    );
    const IconWrench = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
    );
    const IconZap = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="none" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    );
    const IconTrophy = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path></svg>
    );

    const QUESTIONS_DB = [
      { text: "哥哥做運動，從 9:15 開始，到 10:20 結束。他用了多少分鐘？", start: "09:15", nextHour: "10:00", end: "10:20", ans1: 45, ans2: 20, ansTotal: 65 },
      { text: "美兒在補習社，4:50 到達，5:35 離開。她在補習社逗留了多少分鐘？", start: "04:50", nextHour: "05:00", end: "05:35", ans1: 10, ans2: 35, ansTotal: 45 },
      { text: "健威在圖書館看書，從 10:38 看到 11:15。他看了多少分鐘？", start: "10:38", nextHour: "11:00", end: "11:15", ans1: 22, ans2: 15, ansTotal: 37 },
      { text: "爸爸開會，從 10:45 開始，到 11:20 結束。會議長多少分鐘？", start: "10:45", nextHour: "11:00", end: "11:20", ans1: 15, ans2: 20, ansTotal: 35 },
      { text: "美欣參加排球練習，從 10:15 開始，到 11:05 結束。共用了多少分鐘？", start: "10:15", nextHour: "11:00", end: "11:05", ans1: 45, ans2: 5, ansTotal: 50 },
      { text: "家希在公園遊玩，從 8:18 玩到 9:10。他玩了多少分鐘？", start: "08:18", nextHour: "09:00", end: "09:10", ans1: 42, ans2: 10, ansTotal: 52 },
      { text: "祖父做早操，從 6:25 開始，到 7:15 結束。他做了多少分鐘？", start: "06:25", nextHour: "07:00", end: "07:15", ans1: 35, ans2: 15, ansTotal: 50 },
      { text: "哥哥排隊買戲票，從 10:42 排到 11:19。他排隊用了多少分鐘？", start: "10:42", nextHour: "11:00", end: "11:19", ans1: 18, ans2: 19, ansTotal: 37 },
      { text: "昌明砌模型，從 5:13 開始，到 6:05 完成。他用了多少分鐘？", start: "05:13", nextHour: "06:00", end: "06:05", ans1: 47, ans2: 5, ansTotal: 52 },
      { text: "佳佳甜品店的員工吃午飯，從 12:28 吃到 1:15。他用了多少分鐘？", start: "12:28", nextHour: "01:00", end: "01:15", ans1: 32, ans2: 15, ansTotal: 47 },
      
      { text: "家浩參觀太空館，從 2:48 參觀到 3:30。他用了多少分鐘？", start: "02:48", nextHour: "03:00", end: "03:30", ans1: 12, ans2: 30, ansTotal: 42 },
      { text: "子青參加閱讀活動，從 3:35 開始，到 4:20 結束。活動長多少分鐘？", start: "03:35", nextHour: "04:00", end: "04:20", ans1: 25, ans2: 20, ansTotal: 45 },
      { text: "少欣做手工，從 4:44 開始，到 5:22 結束。她用了多少分鐘？", start: "04:44", nextHour: "05:00", end: "05:22", ans1: 16, ans2: 22, ansTotal: 38 },
      { text: "倩兒閱讀圖書，從 7:25 閱讀到 8:15。她閱讀了多少分鐘？", start: "07:25", nextHour: "08:00", end: "08:15", ans1: 35, ans2: 15, ansTotal: 50 },
      { text: "正浩吃巧克力，從 1:52 吃到 2:10。他吃了多少分鐘？", start: "01:52", nextHour: "02:00", end: "02:10", ans1: 8, ans2: 10, ansTotal: 18 },
      { text: "珊珊練習寫字，從 5:36 寫到 6:18。她練習了多少分鐘？", start: "05:36", nextHour: "06:00", end: "06:18", ans1: 24, ans2: 18, ansTotal: 42 },
      { text: "家文觀看馬術表演，從 9:55 看到 10:40。他看了多少分鐘？", start: "09:55", nextHour: "10:00", end: "10:40", ans1: 5, ans2: 40, ansTotal: 45 },
      { text: "秀文排隊買小食，從 11:38 排到 12:15。她排了多少分鐘？", start: "11:38", nextHour: "12:00", end: "12:15", ans1: 22, ans2: 15, ansTotal: 37 },
      { text: "陳先生一家乘搭火車，從 10:20 上車，到 11:05 下車。車程是多少分鐘？", start: "10:20", nextHour: "11:00", end: "11:05", ans1: 40, ans2: 5, ansTotal: 45 },
      { text: "智文吃晚餐，從 6:42 吃到 7:20。他吃了多少分鐘？", start: "06:42", nextHour: "07:00", end: "07:20", ans1: 18, ans2: 20, ansTotal: 38 }
    ];

    const shuffleArray = (array) => {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    };

    function App() {
      const [gameState, setGameState] = useState('welcome'); 
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      
      const [inputs, setInputs] = useState({ part1: '', part2: '', total: '' });
      const [feedback, setFeedback] = useState(null); 
      const [errorMsg, setErrorMsg] = useState('');

      const startGame = () => {
        setQuestions(shuffleArray(QUESTIONS_DB));
        setCurrentIndex(0);
        setScore(0);
        setInputs({ part1: '', part2: '', total: '' });
        setFeedback(null);
        setGameState('playing');
      };

      const handleInputChange = (field, value) => {
        setInputs(prev => ({ ...prev, [field]: value }));
        setErrorMsg('');
      };

      const checkAnswer = () => {
        const q = questions[currentIndex];
        let isCorrect = false;
        const showHint = currentIndex < 10; 

        if (showHint) {
          if (inputs.part1 === '' || inputs.part2 === '' || inputs.total === '') {
            setErrorMsg('⚠ 請填好所有數據再踩油門！');
            return;
          }
          isCorrect = (parseInt(inputs.part1) === q.ans1) && 
                      (parseInt(inputs.part2) === q.ans2) && 
                      (parseInt(inputs.total) === q.ansTotal);
        } else {
          if (inputs.total === '') {
            setErrorMsg('⚠ 請輸入總圈速分鐘！');
            return;
          }
          isCorrect = parseInt(inputs.total) === q.ansTotal;
        }

        if (isCorrect) {
          setFeedback('correct');
          setScore(s => s + 1);
        } else {
          setFeedback('wrong');
        }
      };

      const nextQuestion = () => {
        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(curr => curr + 1);
          setInputs({ part1: '', part2: '', total: '' });
          setFeedback(null);
        } else {
          setGameState('result');
        }
      };

      if (gameState === 'welcome') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-gray-800 rounded-3xl shadow-2xl p-8 max-w-lg w-full text-center checkered-border relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-orange-500 via-yellow-400 to-red-600"></div>
              <div className="flex justify-center mb-6 mt-4">
                <div className="w-24 h-24 bg-red-600 rounded-full flex items-center justify-center border-4 border-yellow-400 shadow-[0_0_20px_rgba(239,68,68,0.6)]">
                  <IconCar size={60} className="text-white transform -rotate-12" />
                </div>
              </div>
              <h1 className="text-5xl font-black mb-4 flame-text italic tracking-wider">時間賽車手</h1>
              <p className="text-xl text-gray-300 mb-2 font-bold tracking-widest">HOT TIME SPEEDSTER</p>
              
              <div className="text-left text-gray-300 mb-8 space-y-3 font-medium bg-gray-900 p-6 rounded-xl border border-gray-700">
                <p className="font-bold text-yellow-400 border-b border-gray-700 pb-2 mb-2">🏁 賽事規則 (數學挑戰版)：</p>
                <p className="flex items-start"><IconWrench className="mr-2 text-orange-500 shrink-0"/><span><strong className="text-orange-400">頭 10 題 (有提示)：</strong>駛入「維修站」，導航會教你先算到整點，再計算餘下時間。</span></p>
                <p className="flex items-start"><IconZap className="mr-2 text-blue-400 shrink-0"/><span><strong className="text-blue-400">後 10 題 (極速衝刺)：</strong>無提示全速前進！在大腦自己計好，直接輸入答案衝線。</span></p>
              </div>

              <button 
                onClick={startGame}
                className="w-full bg-gradient-to-r from-red-600 to-orange-500 hover:from-red-500 hover:to-orange-400 text-white font-black text-2xl py-4 rounded-full shadow-[0_0_15px_rgba(239,68,68,0.5)] transform transition hover:scale-105 active:scale-95 flex items-center justify-center space-x-3"
              >
                <IconFlag size={28}/>
                <span className="italic tracking-widest">引擎啟動 START</span>
              </button>
            </div>
          </div>
        );
      }

      if (gameState === 'result') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-gray-800 rounded-3xl shadow-2xl p-10 max-w-lg w-full text-center checkered-border">
              <IconTrophy size={100} className="text-yellow-400 mx-auto mb-4 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)] animate-bounce" />
              <h1 className="text-4xl font-black text-white mb-2 italic">全場總冠軍！</h1>
              <p className="text-xl text-gray-400 mb-6">你的總成績積分是：</p>
              <div className="text-7xl font-black flame-text mb-8 bg-gray-900 py-6 rounded-2xl border-2 border-red-500 shadow-inner">
                {score} <span className="text-3xl text-gray-500">/ 20</span>
              </div>
              <button 
                onClick={startGame}
                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black italic tracking-widest text-2xl py-4 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.5)] transform transition hover:scale-105 active:scale-95 flex items-center justify-center space-x-2"
              >
                <span>重新挑戰 REPLAY</span>
              </button>
            </div>
          </div>
        );
      }

      const q = questions[currentIndex];
      const showHint = currentIndex < 10; 
      
      return (
        <div className="min-h-screen flex flex-col items-center py-6 md:py-10 p-4 font-sans">
          
          <div className="w-full max-w-4xl bg-gray-800 rounded-2xl p-4 shadow-lg mb-8 border border-gray-700 flex flex-col gap-3">
            <div className="flex justify-between items-center text-white font-bold">
              <div className="flex items-center space-x-2 bg-gray-700 px-3 py-1 rounded-lg">
                <IconFlag className="text-white" size={18}/>
                <span className="italic tracking-wider">進度 LAP {currentIndex + 1}/20</span>
              </div>
              <div className="flex items-center space-x-2 bg-gray-700 px-3 py-1 rounded-lg text-yellow-400">
                <IconZap size={18} />
                <span className="italic tracking-wider">積分 PTS: {score}</span>
              </div>
            </div>
            
            <div className="relative w-full h-8 bg-gray-900 rounded-full overflow-hidden border border-gray-600 flex items-center px-1">
              <div className="absolute right-0 top-0 bottom-0 w-8 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIi8+CjxyZWN0IHg9IjQiIHk9IjQiIHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiNmZmYiLz4KPC9zdmc+')] opacity-70"></div>
              <div className="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-yellow-500 transition-all duration-500 z-0" style={{ width: `${((currentIndex) / 20) * 100}%` }}></div>
              <div className="absolute top-1/2 -translate-y-1/2 text-red-500 car-slide z-10 flex items-center drop-shadow-md" style={{ left: `calc(${((currentIndex) / 20) * 100}% - 12px)` }}>
                 <IconCar size={24} />
                 <div className="w-4 h-1 bg-gradient-to-l from-orange-500 to-transparent absolute -left-4"></div>
              </div>
            </div>
          </div>

          {currentIndex === 10 && feedback === null && (
            <div className="w-full max-w-4xl bg-red-900/50 border-l-4 border-red-500 text-red-200 p-4 rounded mb-6 text-lg font-bold animate-pulse flex items-center space-x-3 shadow-lg">
              <IconZap className="text-yellow-400 shrink-0" size={28}/>
              <span>⚠️ 注意車手！前方離開維修區，接下來 10 題沒有提示，全速前進自己計！</span>
            </div>
          )}

          <div className="w-full max-w-4xl bg-gray-800 rounded-3xl shadow-2xl p-6 md:p-10 border-2 border-gray-700 relative overflow-hidden">
            
            {/* 這裡的題目字體保持大和醒目 */}
            <h2 className="text-2xl md:text-3xl font-bold text-white mb-8 leading-relaxed relative z-10 text-center">
              {q.text}
            </h2>

            {showHint ? (
              <div className="mb-8 relative z-10">
                <div className="pitstop-border h-1 w-full rounded-t-lg opacity-60 mb-1"></div>
                <div className="bg-gray-900 border border-gray-800 rounded-b-xl p-4 md:p-6 mb-8 shadow-inner opacity-90">
                  <div className="flex items-center space-x-2 text-orange-700 mb-4 font-black italic tracking-widest text-sm md:text-base">
                    <IconWrench size={16} />
                    <span>PIT STOP 問題思路</span>
                  </div>

                  {/* 視覺化時間線 (尺寸調小) */}
                  <div className="flex justify-between items-center relative mb-6 px-2">
                    <div className="absolute top-1/2 left-8 right-8 h-[2px] bg-gray-700 transform -translate-y-1/2"></div>
                    
                    <div className="flex flex-col items-center z-10">
                      <div className="bg-gray-800 border-2 border-blue-800 text-blue-300 rounded-md px-3 py-1 font-bold text-sm md:text-base">{q.start}</div>
                      <span className="mt-1 font-medium text-gray-500 text-xs">起步點</span>
                    </div>
                    
                    <div className="flex flex-col items-center z-10">
                      <div className="bg-gray-800 border-2 border-yellow-700 text-yellow-500 rounded-md px-3 py-1 font-bold text-sm md:text-base">{q.nextHour}</div>
                      <span className="mt-1 font-medium text-gray-500 text-xs">下一個整點</span>
                    </div>
                    
                    <div className="flex flex-col items-center z-10">
                      <div className="bg-gray-800 border-2 border-green-800 text-green-500 rounded-md px-3 py-1 font-bold text-sm md:text-base">{q.end}</div>
                      <span className="mt-1 font-medium text-gray-500 text-xs">完成</span>
                    </div>
                  </div>

                  {/* 分步填寫區 (字體調小) */}
                  <div className="space-y-3 text-sm md:text-base font-medium text-gray-400">
                    <div className="flex flex-wrap items-center gap-2">
                      <span>從</span>
                      <span className="text-blue-400">{q.start}</span>
                      <span>到</span>
                      <span className="text-yellow-600">{q.nextHour}</span>
                      <span>用了</span>
                      <input 
                        type="number" min="0" disabled={feedback !== null}
                        value={inputs.part1} onChange={(e) => handleInputChange('part1', e.target.value)}
                        className="w-12 md:w-16 text-center bg-gray-800 border-b border-blue-800 focus:border-blue-500 focus:outline-none p-1 font-bold text-blue-300"
                      />
                      <span>分鐘</span>
                    </div>
                    
                    <div className="flex flex-wrap items-center gap-2">
                      <span>從</span>
                      <span className="text-yellow-600">{q.nextHour}</span>
                      <span>到</span>
                      <span className="text-green-500">{q.end}</span>
                      <span>用了</span>
                      <input 
                        type="number" min="0" disabled={feedback !== null}
                        value={inputs.part2} onChange={(e) => handleInputChange('part2', e.target.value)}
                        className="w-12 md:w-16 text-center bg-gray-800 border-b border-yellow-700 focus:border-yellow-500 focus:outline-none p-1 font-bold text-yellow-500"
                      />
                      <span>分鐘</span>
                    </div>

                    <div className="flex flex-wrap items-center gap-3 pt-4 mt-2 border-t border-gray-700">
                      <span className="font-bold text-gray-300">總時間:</span>
                      <span className="text-gray-500 w-8 text-center">{inputs.part1 || '?'}</span>
                      <span className="text-gray-600">+</span>
                      <span className="text-gray-500 w-8 text-center">{inputs.part2 || '?'}</span>
                      <span className="text-gray-600">=</span>
                      <input 
                        type="number" min="0" disabled={feedback !== null}
                        value={inputs.total} onChange={(e) => handleInputChange('total', e.target.value)}
                        className="w-16 md:w-20 text-center bg-gray-800 border border-red-800 focus:border-red-500 focus:outline-none rounded p-1 font-bold text-red-400 text-lg md:text-xl"
                      />
                      <span className="text-gray-400">分鐘</span>
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex flex-col justify-center items-center mb-10 text-2xl font-bold relative z-10 bg-gray-900 py-12 rounded-2xl border border-gray-700 shadow-inner">
                <div className="flex items-center space-x-4">
                  <span className="text-gray-400 italic">答案：</span>
                  <input 
                    type="number" min="0" disabled={feedback !== null}
                    value={inputs.total} onChange={(e) => handleInputChange('total', e.target.value)}
                    className="w-36 text-center bg-gray-800 border-4 border-red-600 focus:border-orange-500 focus:outline-none rounded-xl p-4 text-4xl font-black text-white shadow-[0_0_15px_rgba(220,38,38,0.3)]"
                  />
                  <span className="text-gray-400 italic">分鐘</span>
                </div>
              </div>
            )}

            {errorMsg && (
              <div className="text-red-400 font-bold text-center mb-4 animate-pulse bg-red-900/30 py-2 rounded">
                {errorMsg}
              </div>
            )}

            <div className="flex flex-col items-center mt-6">
              {feedback === null ? (
                <button 
                  onClick={checkAnswer}
                  className="bg-blue-600 hover:bg-blue-500 text-white font-black italic tracking-widest text-2xl py-4 px-16 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.6)] transform transition hover:scale-105 active:scale-95"
                >
                  確認答案 SUBMIT
                </button>
              ) : (
                <div className="w-full flex flex-col items-center animate-in fade-in duration-300">
                  {feedback === 'correct' ? (
                    <div className="flex items-center space-x-4 text-green-400 mb-6 bg-green-900/30 px-8 py-5 rounded-2xl border border-green-500/50 shadow-[0_0_15px_rgba(74,222,128,0.2)]">
                      <IconFlag size={40} className="animate-bounce" />
                      <span className="text-3xl font-black italic">極速衝線！答對了！🏁</span>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center mb-6 w-full">
                      <div className="flex items-center space-x-4 text-red-500 bg-red-900/30 px-8 py-5 rounded-2xl border border-red-500/50 mb-4 shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                        <IconWrench size={40} className="animate-pulse" />
                        <span className="text-3xl font-black italic">引擎死火！再算一次！🛠️</span>
                      </div>
                      <button 
                        onClick={() => setFeedback(null)}
                        className="text-yellow-400 hover:text-yellow-300 font-bold underline text-xl tracking-wider"
                      >
                        重新計算 RESTART
                      </button>
                    </div>
                  )}
                  
                  {feedback === 'correct' && (
                    <button 
                      onClick={nextQuestion}
                      className="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white font-black italic tracking-widest text-2xl py-4 px-16 rounded-full shadow-[0_0_15px_rgba(16,185,129,0.5)] transform transition hover:scale-105 active:scale-95 flex items-center space-x-3"
                    >
                      <span>下一題 NEXT LAP</span>
                      <IconCar />
                    </button>
                  )}
                </div>
              )}
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
