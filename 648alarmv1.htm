
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chelsea & Joshua 的早安鬧鐘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 改用 M PLUS Rounded 1c (類粉圓體) 和 Nunito (圓潤英數) */
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;800&family=Nunito:wght@400;700;900&display=swap');

        :root {
            --andy-blue: #87CEEB;
            --woody-yellow: #FFD700;
            --woody-red: #E32636;
            --buzz-green: #9ACD32;
            --buzz-purple: #8A2BE2;
        }

        body {
            /* 使用 Nunito 顯示英數，M PLUS Rounded 1c 顯示中文，確保圓潤效果 */
            font-family: 'Nunito', 'M PLUS Rounded 1c', 'Varela Round', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--andy-blue);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Andy's Room Cloud Wallpaper Effect */
        .cloud-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--andy-blue);
            background-image: 
                radial-gradient(circle 25px at 20% 20%, white 99%, transparent 100%),
                radial-gradient(circle 20px at 23% 18%, white 99%, transparent 100%),
                radial-gradient(circle 20px at 17% 18%, white 99%, transparent 100%),
                radial-gradient(circle 35px at 80% 60%, white 99%, transparent 100%),
                radial-gradient(circle 25px at 83% 58%, white 99%, transparent 100%),
                radial-gradient(circle 25px at 77% 58%, white 99%, transparent 100%);
            background-size: 300px 200px;
            animation: drift 60s linear infinite;
            z-index: -1;
        }

        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: 300px 100px; }
        }

        /* Main Clock Container */
        .toy-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 30px 40px;
            box-shadow: 
                0 10px 25px rgba(0,0,0,0.2),
                inset 0 0 0 8px var(--woody-red), 
                inset 0 0 0 12px white,
                inset 0 0 0 15px var(--woody-yellow);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
            width: 550px;
            position: relative;
            z-index: 10;
        }

        .hk-badge {
            background: var(--buzz-green);
            color: white;
            padding: 6px 18px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 5px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 5.5rem;
            color: #333;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
            line-height: 1;
            margin: 10px 0;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .countdown-display {
            font-size: 1.4rem;
            color: var(--woody-red);
            background: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            border: 3px dashed var(--woody-yellow);
            font-weight: 800;
        }

        .date-display {
            font-size: 1.4rem;
            color: #666;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .message-box {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(255,255,255,0.6);
            border-radius: 20px;
            padding: 15px;
            margin-top: 10px;
        }

        .status-text {
            font-size: 1.8rem;
            color: var(--buzz-purple);
            line-height: 1.4;
            transition: all 0.3s ease;
            font-weight: 800;
        }

        /* Surprise Overlay */
        .surprise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .surprise-element {
            position: absolute;
            font-size: 8rem;
            opacity: 0;
            transition: all 0.5s ease;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .surprise-text {
            font-size: 2.5rem;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 20px;
            margin-top: 10px;
            white-space: nowrap;
        }

        /* Specific Animations */
        @keyframes slideUp {
            0% { transform: translateY(100vh); opacity: 1; }
            20% { transform: translateY(200px); opacity: 1; }
            80% { transform: translateY(200px); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        @keyframes flyAcross {
            0% { transform: translate(-120vw, 50px) rotate(20deg); opacity: 1; }
            100% { transform: translate(120vw, -100px) rotate(20deg); opacity: 1; }
        }

        @keyframes wobbleRun {
            0% { transform: translateX(-100vw) rotate(-10deg); opacity: 1; }
            25% { transform: translateX(-20vw) rotate(10deg); }
            50% { transform: translateX(20vw) rotate(-10deg); }
            75% { transform: translateX(50vw) rotate(10deg); }
            100% { transform: translateX(120vw) rotate(-10deg); opacity: 1; }
        }

        @keyframes popScale {
            0% { transform: scale(0); opacity: 0; }
            10% { transform: scale(1.2); opacity: 1; }
            20% { transform: scale(1); }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shaking {
            animation: shake 0.5s;
            animation-iteration-count: infinite;
            border-color: var(--woody-red);
        }

        .gogogo-text {
            font-size: 4rem;
            color: var(--woody-red);
            font-weight: 900;
            text-shadow: 4px 4px 0px var(--woody-yellow);
            animation: bounce 0.8s infinite alternate;
            letter-spacing: 2px;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        /* Canvas for Fireworks */
        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* Character Icons */
        .icon-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
            font-size: 2.2rem;
        }
        
        .toy-icon {
            transition: transform 0.3s;
            cursor: pointer;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.1));
        }
        .toy-icon:hover {
            transform: scale(1.3) rotate(15deg);
        }

        /* Controls for Demo */
        .controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            opacity: 0.1;
            transition: opacity 0.3s;
            z-index: 50;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: flex-end;
            max-width: 600px;
        }
        .controls:hover {
            opacity: 1;
        }
        
        .btn {
            background: white;
            border: 1px solid #ccc;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: bold;
        }
    </style>
</head>

    <!-- Fireworks Canvas -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Surprise Overlay Container -->

    <div class="toy-container" id="clockPanel">

        <div class="countdown-display" id="countdown">

        </div>
