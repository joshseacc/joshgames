<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Math Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #a4e5d9;
            /* Pokémon Go Map Style Background */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 2px, transparent 2px),
                linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-position: -2px -2px, -2px -2px, -1px -1px, -1px -1px;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.05) 100%);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0; left: 0;
            animation: fadeIn 0.4s ease-out;
        }
        
        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2), 0 10px 10px rgba(0,0,0,0.1);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.2), 0 4px 4px rgba(0,0,0,0.1);
        }

        .mystic { background: linear-gradient(135deg, #1e3a8a, #3b82f6); border: 2px solid #60a5fa; color: white; }
        .mystic:active { box-shadow: 0 2px 0px #1e40af; }
        
        .instinct { background: linear-gradient(135deg, #a16207, #eab308); border: 2px solid #fde047; color: white; }
        .instinct:active { box-shadow: 0 2px 0px #854d0e; }
        
        .valor { background: linear-gradient(135deg, #991b1b, #ef4444); border: 2px solid #f87171; color: white; }
        .valor:active { box-shadow: 0 2px 0px #7f1d1d; }

        .pokemon-sprite {
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.4));
            animation: float 3s ease-in-out infinite;
        }

        .silhouette {
            filter: brightness(0) drop-shadow(0 2px 2px rgba(0,0,0,0.5));
            opacity: 0.6;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-overlay {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
        }

        .rocket-bg {
            background: radial-gradient(circle at center, #4a0000 0%, #000000 100%);
        }

        .rocket-r {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-weight: 900;
            background: linear-gradient(to bottom, #ff4444, #aa0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px red);
        }

        /* Pokeball animation */
        .pokeball-throw {
            animation: throwAndCatch 1.5s ease-out forwards;
        }

        @keyframes throwAndCatch {
            0% { transform: scale(1) translateY(0) rotate(0deg); }
            30% { transform: scale(1.2) translateY(-100px) rotate(360deg); }
            60% { transform: scale(0.8) translateY(-50px) rotate(720deg); }
            100% { transform: scale(0) translateY(-20px) rotate(1080deg); opacity: 0; }
        }

        .input-box {
            font-size: 1.5rem;
            text-align: center;
            border: 3px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
            background: white;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-box:focus {
            border-color: #3b82f6;
            box-shadow: inset 0 4px 6px rgba(59,130,246,0.2), 0 0 0 4px rgba(59,130,246,0.3);
        }

        /* Progress Bar */
        .progress-container {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.7);
            border-radius: 99px;
            padding: 4px 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .progress-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #cbd5e1;
            margin: 0 2px;
            transition: all 0.3s;
        }
        .progress-dot.active {
            background: #3b82f6;
            box-shadow: 0 0 8px #3b82f6;
            transform: scale(1.2);
        }

        .fake-input {
            font-size: 1.75rem;
            text-align: center;
            border: 3px solid #cbd5e1;
            border-radius: 12px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            user-select: none;
            cursor: pointer;
        }
        .fake-input.active {
            border-color: #3b82f6;
            box-shadow: inset 0 4px 6px rgba(59,130,246,0.1), 0 0 0 4px rgba(59,130,246,0.3);
            background-color: #eff6ff;
        }
        .fake-input.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ef4444;
        }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .btn-numpad {
            background: white;
            border-radius: 12px;
            padding: 10px 0;
            font-size: 1.5rem;
            font-weight: 900;
            color: #334155;
            box-shadow: 0 4px 0 #cbd5e1;
            transition: all 0.1s;
            user-select: none;
            touch-action: manipulation; /* 針對手機觸控優化 */
        }
        .btn-numpad:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #cbd5e1;
            background: #f8fafc;
        }
    </style>
</head>
<body>

<div class="app-container" id="app">

    <!-- LOGIN / HOME SCREEN -->
    <div id="screen-home" class="screen active p-6 flex-col justify-center items-center text-center">
        <div class="mb-8 popIn" style="animation: popIn 0.6s ease-out;">
            <div class="relative inline-block">
                <!-- Decorative Pokeball SVG -->
                <svg width="120" height="120" viewBox="0 0 100 100" class="mx-auto mb-4 drop-shadow-xl">
                    <circle cx="50" cy="50" r="48" fill="white" stroke="#333" stroke-width="4"/>
                    <path d="M2,50 A48,48 0 0,1 98,50 Z" fill="#EF4444" stroke="#333" stroke-width="4"/>
                    <path d="M2,50 L98,50" stroke="#333" stroke-width="6"/>
                    <circle cx="50" cy="50" r="16" fill="white" stroke="#333" stroke-width="6"/>
                    <circle cx="50" cy="50" r="8" fill="white" stroke="#333" stroke-width="2"/>
                </svg>
            </div>
            <h1 class="text-4xl font-black text-gray-800 tracking-tight" style="text-shadow: 2px 2px 0px white, -1px -1px 0px white, 1px -1px 0px white, -1px 1px 0px white;">
                Pokémon<br><span class="text-3xl text-blue-600">Math Master</span>
            </h1>
            <p class="text-gray-600 mt-2 font-bold bg-white/60 rounded-full px-4 py-1 inline-block">成為數學與神獸大師！</p>
        </div>

        <div class="w-full space-y-4 mt-4">
            <button onclick="startGame(1)" class="w-full btn-3d mystic rounded-2xl py-4 px-6 flex items-center justify-between">
                <div class="text-left">
                    <div class="text-xs opacity-80 mb-1">第一部分</div>
                    <div class="text-xl font-bold">米與厘米加減法</div>
                </div>
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-black">1</div>
            </button>

            <button onclick="startGame(2)" class="w-full btn-3d instinct rounded-2xl py-4 px-6 flex items-center justify-between">
                <div class="text-left">
                    <div class="text-xs opacity-80 mb-1">第二部分</div>
                    <div class="text-xl font-bold">元與角加減法</div>
                </div>
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-black">2</div>
            </button>

            <button onclick="startGame(3)" class="w-full btn-3d valor rounded-2xl py-4 px-6 flex items-center justify-between">
                <div class="text-left">
                    <div class="text-xs opacity-80 mb-1">第三部分</div>
                    <div class="text-xl font-bold">小時與分鐘加減法</div>
                </div>
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-black">3</div>
            </button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="screen p-4 flex-col bg-white/40">
        <!-- Header -->
        <div class="flex justify-between items-center mb-2 bg-white/80 p-3 rounded-2xl shadow-sm shrink-0">
            <button onclick="returnToHome()" class="text-gray-500 font-bold px-3 py-1 bg-gray-200 rounded-full hover:bg-gray-300">
                &larr; 離開
            </button>
            <div class="text-sm font-bold text-gray-700" id="hint-text">滿100厘米 = 1米</div>
            <div class="text-blue-600 font-black" id="score-text">0 / 10</div>
        </div>

        <!-- Progress -->
        <div class="progress-container mb-2 shrink-0" id="progress-bar">
            <!-- Filled by JS -->
        </div>

        <!-- Current Target Legendary -->
        <div class="flex justify-center mb-2 relative h-24 items-end pb-2 shrink-0" id="target-pokemon-container">
            <div class="absolute w-24 h-6 bg-black/20 rounded-[100%] bottom-0 blur-sm"></div>
            <img id="target-pokemon" src="" class="w-24 h-24 object-contain silhouette" alt="Target">
        </div>

        <!-- Question Card -->
        <div class="bg-white rounded-3xl p-4 shadow-lg mb-4 text-center border-4 border-gray-100 flex-grow flex flex-col justify-center">
            <h2 class="text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">野生神獸出現了！</h2>
            <div class="text-xl md:text-2xl font-black text-gray-800 mb-4" id="question-text">
                <!-- Question text here -->
            </div>

            <!-- Custom Input Area -->
            <div class="flex items-center justify-center gap-2">
                <div id="input-container-1" class="fake-input active min-w-[4rem] h-14 md:min-w-[5rem] md:h-16 px-2" onclick="setActiveInput(1)">
                    <span id="input-val-1" class="text-gray-800 font-black"></span>
                </div>
                <span class="text-lg font-bold text-gray-600 whitespace-nowrap" id="unit-1">米</span>
                
                <div id="input-wrapper-2" class="flex items-center gap-2">
                    <div id="input-container-2" class="fake-input min-w-[4rem] h-14 md:min-w-[5rem] md:h-16 px-2" onclick="setActiveInput(2)">
                        <span id="input-val-2" class="text-gray-800 font-black"></span>
                    </div>
                    <span class="text-lg font-bold text-gray-600 whitespace-nowrap" id="unit-2">厘米</span>
                </div>
            </div>
            
            <!-- Warning Message -->
            <div id="warning-msg" class="text-red-500 font-bold text-sm mt-3 h-4 opacity-0 transition-opacity">
                請填寫完整答案！(如沒有請填0)
            </div>
        </div>

        <!-- Custom Numpad -->
        <div class="grid grid-cols-3 gap-2 w-full px-2 mb-3 shrink-0">
            <button class="btn-numpad" onclick="typeNum('1')">1</button>
            <button class="btn-numpad" onclick="typeNum('2')">2</button>
            <button class="btn-numpad" onclick="typeNum('3')">3</button>
            <button class="btn-numpad" onclick="typeNum('4')">4</button>
            <button class="btn-numpad" onclick="typeNum('5')">5</button>
            <button class="btn-numpad" onclick="typeNum('6')">6</button>
            <button class="btn-numpad" onclick="typeNum('7')">7</button>
            <button class="btn-numpad" onclick="typeNum('8')">8</button>
            <button class="btn-numpad" onclick="typeNum('9')">9</button>
            <button class="btn-numpad text-red-500 text-xl" onclick="typeNum('C')">C</button>
            <button class="btn-numpad" onclick="typeNum('0')">0</button>
            <button class="btn-numpad text-gray-500 text-xl" onclick="typeNum('DEL')">⌫</button>
        </div>

        <!-- Catch Button -->
        <button onclick="checkAnswer()" class="w-full shrink-0 bg-green-500 active:bg-green-600 text-white font-black text-xl py-3 rounded-2xl btn-3d mb-2 flex items-center justify-center gap-2 border-2 border-green-600">
            <svg width="24" height="24" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" fill="white" stroke="currentColor" stroke-width="4"/>
                <path d="M2,50 A48,48 0 0,1 98,50 Z" fill="#EF4444" stroke="currentColor" stroke-width="4"/>
                <path d="M2,50 L98,50" stroke="currentColor" stroke-width="6"/>
                <circle cx="50" cy="50" r="16" fill="white" stroke="currentColor" stroke-width="6"/>
            </svg>
            投擲精靈球！
        </button>
    </div>

    <!-- CORRECT MODAL -->
    <div id="modal-correct" class="modal-overlay absolute inset-0 z-50 hidden flex-col justify-center items-center p-6 text-center">
        <div class="absolute inset-0 bg-yellow-400/20" style="background-image: repeating-conic-gradient(from 0deg, transparent 0deg 15deg, rgba(255,255,255,0.3) 15deg 30deg); animation: spin 20s linear infinite;"></div>
        <style> @keyframes spin { 100% { transform: rotate(360deg); } } </style>
        
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full relative z-10 shadow-2xl transform transition-transform border-4 border-yellow-400" style="animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
            <div class="text-yellow-500 mb-2">
                <svg class="w-16 h-16 mx-auto" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
            </div>
            <h2 class="text-3xl font-black text-gray-800 mb-2">太棒了！</h2>
            <p class="text-gray-600 font-bold mb-6 text-lg">你成功捕獲了 <span id="caught-name" class="text-blue-600 font-black"></span>！</p>
            
            <div class="relative w-40 h-40 mx-auto mb-6 bg-blue-50 rounded-full flex items-center justify-center border-4 border-blue-100">
                <img id="caught-img" src="" class="w-32 h-32 object-contain pokemon-sprite" alt="Caught Pokemon">
            </div>

            <button onclick="nextQuestion()" class="w-full bg-yellow-400 active:bg-yellow-500 text-gray-900 font-black text-xl py-4 rounded-2xl btn-3d">
                繼續尋找神獸 &rarr;
            </button>
        </div>
    </div>

    <!-- WRONG MODAL (TEAM ROCKET) -->
    <div id="modal-wrong" class="modal-overlay rocket-bg absolute inset-0 z-50 hidden flex-col justify-center items-center p-6 text-center text-white">
        <div class="relative z-10 w-full max-w-sm" style="animation: popIn 0.4s ease-out;">
            <div class="text-8xl rocket-r mb-2">R</div>
            <h2 class="text-3xl font-black text-white mb-4 italic tracking-wide" style="text-shadow: 2px 2px 0 #aa0000;">火箭兵團來了！</h2>
            
            <div class="bg-black/60 border-2 border-red-600 p-6 rounded-2xl mb-8 shadow-[0_0_20px_rgba(255,0,0,0.4)] relative">
                <div class="absolute -top-3 -left-3 text-4xl">😈</div>
                <p class="text-lg font-bold leading-relaxed mb-4" id="rocket-mockery">
                    既然你誠心誠意地發問了，<br>我們就大發慈悲地告訴你...<br><span class="text-red-400 text-xl block mt-2">你算錯啦！哈哈哈！</span>
                </p>
                <div class="text-sm text-gray-300 bg-red-900/50 p-3 rounded-lg border border-red-800">
                    小提示：請檢查清楚進位和退位喔！
                </div>
            </div>

            <button onclick="closeWrongModal()" class="w-full bg-red-600 active:bg-red-700 text-white font-black text-xl py-4 rounded-2xl btn-3d shadow-[0_0_15px_rgba(255,0,0,0.5)]">
                可惡！讓我再試一次！
            </button>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="screen-end" class="screen p-6 flex-col justify-center items-center text-center bg-white/90 backdrop-blur-sm z-40">
        <h1 class="text-4xl font-black text-yellow-500 mb-2" style="text-shadow: 2px 2px 0px #b45309;">恭喜過關！</h1>
        <p class="text-xl font-bold text-gray-700 mb-8">你已經成為數學神獸大師！</p>
        
        <div class="bg-blue-50 rounded-3xl p-6 border-4 border-blue-200 w-full mb-8 shadow-inner">
            <h3 class="font-black text-gray-600 mb-4">你的神獸圖鑑</h3>
            <div class="grid grid-cols-5 gap-2" id="collection-grid">
                <!-- Filled by JS -->
            </div>
        </div>

        <button onclick="returnToHome()" class="w-full bg-blue-500 active:bg-blue-600 text-white font-black text-xl py-4 rounded-full btn-3d">
            回到主選單
        </button>
    </div>

</div>

<script>

                { q: "100元 - 32元 8角", format: "double", a1: 67, a2: 2 },
                { q: "6元 9角 + 3元 9角", format: "double", a1: 10, a2: 8 },
                { q: "42元 3角 - 28元 7角", format: "double", a1: 13, a2: 6 }
            ]
        },
        3: {
            hint: "滿60分鐘 = 1小時",
            unit1: "小時", unit2: "分鐘",
            list: [
                { q: "90分鐘", format: "double", a1: 1, a2: 30 },
                { q: "2小時 15分鐘", format: "single", a1: 135 },
                { q: "130分鐘", format: "double", a1: 2, a2: 10 },
                { q: "1小時 50分鐘", format: "single", a1: 110 },
                { q: "180分鐘", format: "double", a1: 3, a2: 0 },
                { q: "2小時 40分鐘 + 1小時 35分鐘", format: "double", a1: 4, a2: 15 },
                { q: "4小時 10分鐘 - 1小時 50分鐘", format: "double", a1: 2, a2: 20 },
                { q: "3小時 45分鐘 + 2小時 20分鐘", format: "double", a1: 6, a2: 5 },
                { q: "5小時 - 2小時 15分鐘", format: "double", a1: 2, a2: 45 },
                { q: "1小時 55分鐘 + 3小時 35分鐘", format: "double", a1: 5, a2: 30 },
                { q: "6小時 25分鐘 - 3小時 40分鐘", format: "double", a1: 2, a2: 45 },
                { q: "45分鐘 + 1小時 30分鐘", format: "double", a1: 2, a2: 15 },
                { q: "8小時 5分鐘 - 4小時 55分鐘", format: "double", a1: 3, a2: 10 },
                { q: "2小時 30分鐘 + 4小時 30分鐘", format: "double", a1: 7, a2: 0 },
                { q: "10小時 - 5小時 48分鐘", format: "double", a1: 4, a2: 12 }
            ]
        }
    };

    const rocketMockeryTexts = [
        "既然你誠心誠意地發問了，<br>我們就大發慈悲地告訴你...<br><span class='text-red-400 text-xl block mt-2'>你算錯啦！哈哈哈！</span>",
        "白洞，白色的明天在等著我們...<br>但你還要再算一次！<br><span class='text-red-400 text-xl block mt-2'>準備接受失敗吧！</span>",
        "連這題都不會？<br>難道你的大腦被催眠貘吃掉了嗎？<br><span class='text-red-400 text-xl block mt-2'>太弱了！</span>",
        "為了防止世界被破壞，<br>為了守護世界的和平...<br><span class='text-red-400 text-xl block mt-2'>我們決定沒收你的神獸！算錯了！</span>"
    ];

    // State Variables
    let currentSection = null;
    let currentQIndex = 0;
    let score = 0;
    
    let activeInputId = 1;
    let inputVals = { 1: '', 2: '' };

    // DOM Elements
    const screens = {
        home: document.getElementById('screen-home'),
        game: document.getElementById('screen-game'),
        end: document.getElementById('screen-end')
    };
    
    function showScreen(screenId) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[screenId].classList.add('active');
    }

    function startGame(sectionId) {
        currentSection = sectionId;
        currentQIndex = 0;
        score = 0;
        
        const data = questionsData[currentSection];
        document.getElementById('hint-text').innerText = data.hint;
        document.getElementById('unit-1').innerText = data.unit1;
        document.getElementById('unit-2').innerText = data.unit2;
        
        setupProgressBar();
        loadQuestion();
        showScreen('game');
    }

    function returnToHome() {
        showScreen('home');
    }

    function setupProgressBar() {
        const data = questionsData[currentSection];
        const bar = document.getElementById('progress-bar');
        bar.innerHTML = '';
        for(let i=0; i<data.list.length; i++) {
            const dot = document.createElement('div');
            dot.className = 'progress-dot';
            dot.id = `dot-${i}`;
            dot.style.width = '10px';
            dot.style.height = '10px';
            dot.style.margin = '0 1px';
            bar.appendChild(dot);
        }
    }

    function loadQuestion() {
        const data = questionsData[currentSection];
        const q = data.list[currentQIndex];
        const targetPokemon = legendaries[currentQIndex];

        // Update Progress UI
        document.getElementById('score-text').innerText = `${currentQIndex + 1} / ${data.list.length}`;
        for(let i=0; i<data.list.length; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if(i === currentQIndex) dot.classList.add('active');
            else dot.classList.remove('active');
        }

        // Set Question Text
        document.getElementById('question-text').innerText = q.q + " = ?";
        
        // Handle input format (single vs double)
        const wrapper2 = document.getElementById('input-wrapper-2');
        if (q.format === 'single') {
            wrapper2.style.display = 'none';
            document.getElementById('unit-1').innerText = data.unit2;
        } else {
            wrapper2.style.display = 'flex';
            document.getElementById('unit-1').innerText = data.unit1;
            document.getElementById('unit-2').innerText = data.unit2;
        }

        // Clear Custom Inputs
        inputVals = { 1: '', 2: '' };
        document.getElementById('input-val-1').innerText = '';
        document.getElementById('input-val-2').innerText = '';
        document.getElementById('warning-msg').style.opacity = '0';
        setActiveInput(1);

        // Set Target Pokemon Silhouette
        const targetImg = document.getElementById('target-pokemon');
        targetImg.src = `${POKEMON_SPRITE_URL}${targetPokemon.id}.png`;
        targetImg.classList.add('silhouette');
        targetImg.classList.remove('pokeball-throw');
    }

    function setActiveInput(id) {
        activeInputId = id;
        document.getElementById('input-container-1').classList.remove('active');
        document.getElementById('input-container-2').classList.remove('active');
        document.getElementById(`input-container-${id}`).classList.add('active');
    }

    function typeNum(val) {
        let currentStr = inputVals[activeInputId];
        
        if (val === 'C') {
            currentStr = '';
        } else if (val === 'DEL') {
            currentStr = currentStr.slice(0, -1);
        } else {
            // 限制最多輸入4位數，防止版面破壞
            if (currentStr.length < 4) {
                currentStr += val;
            }
        }
        
        inputVals[activeInputId] = currentStr;
        document.getElementById(`input-val-${activeInputId}`).innerText = currentStr;
        
        // 隱藏警告
        document.getElementById('warning-msg').style.opacity = '0';
    }

    function showWarning(id1, id2 = null) {
        const warning = document.getElementById('warning-msg');
        warning.style.opacity = '1';
        
        document.getElementById(`input-container-${id1}`).classList.add('shake');
        if (id2) document.getElementById(`input-container-${id2}`).classList.add('shake');
        
        setTimeout(() => {
            document.getElementById(`input-container-${id1}`).classList.remove('shake');
            if (id2) document.getElementById(`input-container-${id2}`).classList.remove('shake');
        }, 500);
    }

    function checkAnswer() {
        const data = questionsData[currentSection];
        const q = data.list[currentQIndex];
        
        const in1 = inputVals[1].trim();
        const in2 = inputVals[2].trim();
        
        let isCorrect = false;
        
        if (q.format === 'single') {
            if (in1 === '') {
                showWarning(1);
                return;
            }
            if (parseInt(in1, 10) === q.a1) isCorrect = true;
        } else {
            if (in1 === '' || in2 === '') {
                showWarning(in1 === '' ? 1 : 2, in2 === '' ? 2 : null);
                return;
            }
            if (parseInt(in1, 10) === q.a1 && parseInt(in2, 10) === q.a2) isCorrect = true;
        }

        if (isCorrect) {
            handleCorrect();
        } else {
            handleWrong();
        }
    }

    function handleCorrect() {
        const targetPokemon = legendaries[currentQIndex];
        
        // Remove silhouette class to reveal visually in background
        const targetImg = document.getElementById('target-pokemon');
        targetImg.classList.remove('silhouette');
        
        // Setup Modal content
        document.getElementById('caught-name').innerText = targetPokemon.name;
        document.getElementById('caught-img').src = `${POKEMON_SPRITE_URL}${targetPokemon.id}.png`;
        
        // Show Modal
        document.getElementById('modal-correct').classList.remove('hidden');
        document.getElementById('modal-correct').classList.add('flex');
    }

    function handleWrong() {
        // Randomize Rocket text
        const randomText = rocketMockeryTexts[Math.floor(Math.random() * rocketMockeryTexts.length)];
        document.getElementById('rocket-mockery').innerHTML = randomText;
        
        // Show Modal
        document.getElementById('modal-wrong').classList.remove('hidden');
        document.getElementById('modal-wrong').classList.add('flex');
    }

    function closeWrongModal() {
        document.getElementById('modal-wrong').classList.add('hidden');
        document.getElementById('modal-wrong').classList.remove('flex');
        
        // Highlight inputs briefly
        const i1 = document.getElementById('input-container-1');
        const i2 = document.getElementById('input-container-2');
        if(i1) i1.classList.add('border-red-500');
        if(i2) i2.classList.add('border-red-500');
        setTimeout(() => {
            if(i1) i1.classList.remove('border-red-500');
            if(i2) i2.classList.remove('border-red-500');
        }, 1000);
    }

    function nextQuestion() {
        // Hide modal
        document.getElementById('modal-correct').classList.add('hidden');
        document.getElementById('modal-correct').classList.remove('flex');
        
        // Mark dot as green (completed)
        document.getElementById(`dot-${currentQIndex}`).style.background = '#22c55e';
        document.getElementById(`dot-${currentQIndex}`).style.boxShadow = 'none';

        const data = questionsData[currentSection];
        currentQIndex++;
        
        if (currentQIndex < data.list.length) {
            loadQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        showScreen('end');
        
        const data = questionsData[currentSection];
        const grid = document.getElementById('collection-grid');
        grid.innerHTML = '';
        
        for(let i = 0; i < data.list.length; i++) {
            const leg = legendaries[i];
            // Simulate stamp/collection card effect
            const cell = document.createElement('div');
            cell.className = 'bg-white rounded-xl p-2 border-2 border-gray-200 shadow-sm flex flex-col items-center popIn';
            cell.style.animationDelay = `${i * 0.1}s`;
            
            const img = document.createElement('img');
            img.src = `${POKEMON_SPRITE_URL}${leg.id}.png`;
            img.className = 'w-12 h-12 object-contain mb-1 drop-shadow-md';
            
            const name = document.createElement('div');
            name.className = 'text-[10px] font-bold text-gray-600 truncate w-full text-center';
            name.innerText = leg.name;
            
            cell.appendChild(img);
            cell.appendChild(name);
            grid.appendChild(cell);
        }
    }

    // Prevent default touch behaviors like double-tap zoom on inputs
    document.addEventListener('dblclick', function(event) {
        event.preventDefault();
    }, { passive: false });

</script>
</body>
</html>
