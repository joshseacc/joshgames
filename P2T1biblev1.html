                    colors: {
                        pastel: {

                            yellow: '#FEF9C3',
                            green: '#DCFCE7'
                        }
                    }
                }
            }

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif !important;
            /* Beautiful soft animated gradient background */
            background: linear-gradient(-45deg, #E0F2FE, #F3E8FF, #FCE7F3, #FEF9C3);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: #475569;
            user-select: none;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08);
        }

        /* Playful Button Interactions */
        .btn-hover-effect {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-effect:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(0,0,0,0.1);
        }
        .btn-hover-effect:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 5px 10px -5px rgba(0,0,0,0.1);
        }

        /* Coin Bounce Animation */
        @keyframes coinBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); color: #F59E0B; }
        }
        .coin-update {
            animation: coinBounce 0.5s ease-in-out;
        }

        /* Hidden Screen */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .screen.active {
            display: flex;
            opacity: 1;
        }
    </style>
</head>
<body class="flex flex-col">

        </button>

                        👦👧
                    </div>

                </button>

                            <i class="fas fa-lock"></i> 未解鎖
                        </div>
                    </div>
                </button>
            </div>
        </div>

        <!-- ================= GAME 1 MENU ================= -->
        <div id="screen-game1-menu" class="screen flex-col items-center w-full max-w-2xl">
            <div class="glass-card rounded-3xl p-10 w-full text-center">
                <h2 class="text-4xl font-black text-blue-600 mb-8">選擇難度</h2>

            </div>
        </div>

            { q: "當叫眾人知道你們_____的心。", ans: "謙讓", options: ["謙讓", "順服", "勇敢", "善良"] },
            { q: "看哪，弟兄和睦同居，是何等的_____，何等的_____！", ans: "善 / 美", options: ["善 / 美", "好 / 樂", "真 / 善", "聖 / 潔"] },
            { q: "愛神的，也當愛_____，這是我們從神所受的_____。", ans: "弟兄 / 命令", options: ["弟兄 / 命令", "朋友 / 教導", "父母 / 祝福", "鄰舍 / 律法"] }
        ];

        const shopData = [
            { id: 1, name: "閃亮貼紙", price: 30, icon: "fa-star", color: "text-yellow-500", bg: "bg-yellow-100" },
            { id: 2, name: "精美文具套裝", price: 50, icon: "fa-pencil-ruler", color: "text-blue-500", bg: "bg-blue-100" },
            { id: 3, name: "可愛小熊玩偶", price: 100, icon: "fa-paw", color: "text-pink-500", bg: "bg-pink-100" }
        ];

        // --- State ---
        let coins = 0;
        let hardModeCleared = false;
        let currentQuestions = [];
        let currentQIndex = 0;
        let currentGameType = ''; // 'g1e', 'g1h', 'g2'
        let purchasedItems = [];

        // --- Core UI Functions ---
        function updateCoinsDisplay(addAmount = 0) {
            coins += addAmount;
            const counter = document.getElementById('coin-counter');
            counter.innerText = coins;
            if (addAmount > 0) {
                counter.classList.remove('coin-update');
                void counter.offsetWidth; // trigger reflow
                counter.classList.add('coin-update');
            }
        }

        function checkLockStatus() {
            const lock = document.getElementById('shop-lock');
            if (hardModeCleared) {
                lock.style.display = 'none';
            } else {
                lock.style.display = 'flex';
            }
        }

        function navTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
            });
            setTimeout(() => {
                document.getElementById(screenId).classList.add('active');
            }, 50); // slight delay for smoother DOM update
        }

        function goHome() {
            navTo('screen-home');
            checkLockStatus();
        }

        function triggerConfetti() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#FF6B6B', '#4ECDC4', '#FFE66D', '#A8E6CF']
            });
        }

        // --- Modal ---
        function showModal(type, title, msg, callback) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            const icon = document.getElementById('modal-icon');
            const titleEl = document.getElementById('modal-title');
            const btn = document.getElementById('modal-btn');
            const msgEl = document.getElementById('modal-msg');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);

            titleEl.innerText = title;
            msgEl.innerText = msg;

            if (type === 'success') {
                icon.innerHTML = '🌟';
                titleEl.className = 'text-3xl font-black mb-3 text-green-500';
                btn.className = 'w-full text-xl font-bold py-4 rounded-2xl btn-hover-effect shadow-lg text-white bg-green-500 hover:bg-green-600';
            } else if (type === 'error') {
                icon.innerHTML = '😅';
                titleEl.className = 'text-3xl font-black mb-3 text-red-500';
                btn.className = 'w-full text-xl font-bold py-4 rounded-2xl btn-hover-effect shadow-lg text-white bg-red-500 hover:bg-red-600';
            } else if (type === 'info') {
                icon.innerHTML = '🔒';
                titleEl.className = 'text-3xl font-black mb-3 text-blue-500';
                btn.className = 'w-full text-xl font-bold py-4 rounded-2xl btn-hover-effect shadow-lg text-white bg-blue-500 hover:bg-blue-600';
            }

            btn.onclick = () => {
                modal.classList.add('opacity-0');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    if(callback) callback();
                }, 300);
            };
        }

        // --- Game Logic ---
        function startGame1(difficulty) {
            currentGameType = difficulty === 'easy' ? 'g1e' : 'g1h';
            currentQuestions = difficulty === 'easy' ? [...g1EasyData] : [...g1HardData];
            currentQIndex = 0;
            navTo('screen-game-play');
            renderQuestion();
        }

        function startGame2() {
            currentGameType = 'g2';
            currentQuestions = [...g2Data];
            currentQIndex = 0;
            navTo('screen-game-play');
            renderQuestion();
        }

        function renderQuestion() {
            if (currentQIndex >= currentQuestions.length) {
                // Game Finished
                if (currentGameType === 'g1h') {
                    hardModeCleared = true;
                    showModal('success', '太厲害了！', '你完成了高級版！\n🎁「禮物換領處」已經為你解鎖啦！', goHome);
                } else {
                    showModal('success', '恭喜過關！', '你完成了所有題目！', goHome);
                }
                return;
            }

            const q = currentQuestions[currentQIndex];
            document.getElementById('game-progress').innerText = `第 ${currentQIndex + 1} / ${currentQuestions.length} 題`;
            
            const qArea = document.getElementById('question-area');
            const optArea = document.getElementById('options-area');
            qArea.innerHTML = '';
            optArea.innerHTML = '';

            // Setup Title & Question Area based on type
            if (currentGameType === 'g1e') {
                document.getElementById('game-title').innerText = '猜猜我是誰？ 🤔';
                qArea.innerHTML = `
                    <p class="text-xl font-bold text-slate-500 mb-3">關係：<span class="text-blue-600 text-2xl">${q.clues[0]}</span></p>
                    <p class="text-xl font-bold text-slate-500">事蹟：<span class="text-indigo-600 text-2xl">${q.clues[1]}</span></p>
                `;
            } else if (currentGameType === 'g1h') {
                document.getElementById('game-title').innerText = '配對大挑戰！ 🔥';
                qArea.innerHTML = `
                    <div class="text-3xl md:text-4xl font-black text-white bg-orange-400 px-8 py-3 rounded-full shadow-md mb-2">${q.name}</div>
                    <p class="text-lg font-bold text-slate-400 mt-4">請選出正確的關係與事蹟</p>
                `;
            } else if (currentGameType === 'g2') {
                document.getElementById('game-title').innerText = '金句填充 📖';
                // Replace blanks with styled dashes
                const formattedQ = q.q.replace(/_____/g, '<span class="inline-block w-16 border-b-4 border-purple-400 mx-2 mb-1"></span>');
                qArea.innerHTML = `<p class="text-3xl font-black text-slate-700 leading-relaxed">${formattedQ}</p>`;
            }

            // Setup Options
            // Now everyone has 4 options. We use a 2x2 grid on medium screens and up.
            let layoutClass = 'grid-cols-1 md:grid-cols-2';
            
            optArea.className = `grid gap-4 ${layoutClass}`;
            
            // Randomize options order so the answer isn't always in the same place
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                // Adjust text size based on game mode because Hard mode has longer text
                let textSize = currentGameType === 'g1h' ? 'text-lg md:text-xl' : 'text-xl md:text-2xl';
                
                btn.className = `glass-card btn-hover-effect ${textSize} font-bold py-5 px-6 rounded-2xl text-slate-700 bg-white hover:bg-yellow-50 border-2 border-transparent hover:border-yellow-300 leading-snug`;
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.ans);
                optArea.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                triggerConfetti();
                updateCoinsDisplay(10);
                showModal('success', '答對了！', '好棒喔！獲得 10 個金幣！', () => {
                    currentQIndex++;
                    renderQuestion();
                });
            } else {
                showModal('error', '哎呀答錯了', `正確答案是：\n「${correct}」\n繼續加油喔！`, () => {
                    currentQIndex++;
                    renderQuestion();
                });
            }
        }

        // --- Shop Logic ---
        function enterShop() {
            if (!hardModeCleared) {
                showModal('info', '尚未解鎖', '請先完成「人物配對遊戲（高級版）」才能解鎖禮物換領處喔！', null);
                return;
            }
            navTo('screen-shop');
            renderShop();
        }

        function renderShop() {
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';

            shopData.forEach(item => {
                const isBought = purchasedItems.includes(item.id);
                const card = document.createElement('div');
                card.className = `glass-card rounded-3xl p-8 flex flex-col items-center justify-between transition-all ${isBought ? 'opacity-75 grayscale-[0.2]' : ''}`;
                
                let btnHTML = '';
                if (isBought) {
                    btnHTML = `<button disabled class="w-full py-3 mt-4 rounded-xl font-bold text-lg bg-slate-200 text-slate-500 cursor-not-allowed">已換領</button>`;
                } else {
                    btnHTML = `<button onclick="buyItem(${item.id}, ${item.price}, '${item.name}')" class="w-full py-3 mt-4 rounded-xl font-bold text-lg btn-hover-effect bg-pink-500 hover:bg-pink-600 text-white shadow-md">
                        兌換
                    </button>`;
                }

                card.innerHTML = `
                    <div class="w-24 h-24 rounded-full ${item.bg} flex items-center justify-center mb-4 shadow-inner">
                        <i class="fas ${item.icon} text-5xl ${item.color}"></i>
                    </div>
                    <h3 class="text-2xl font-black text-slate-700 mb-3">${item.name}</h3>
                    <div class="flex items-center gap-2 bg-yellow-100 px-4 py-2 rounded-full text-lg font-bold text-yellow-700">
                        <i class="fas fa-coins text-yellow-500"></i> ${item.price}
                    </div>
                    ${btnHTML}
                `;
                container.appendChild(card);
            });
        }

        function buyItem(id, price, name) {
            if (coins >= price) {
                coins -= price;
                updateCoinsDisplay(0); // Update text without adding
                purchasedItems.push(id);
                triggerConfetti();
                renderShop(); // Re-render to show "已換領"
                showModal('success', '兌換成功！', `你成功用 ${price} 金幣換取了「${name}」！`, null);
            } else {
                const diff = price - coins;
                showModal('error', '金幣不夠喔', `還差 ${diff} 個金幣，快去玩遊戲賺取吧！`, null);
            }
        }

        // Initialize
        checkLockStatus();
    </script>
</body>
</html>
