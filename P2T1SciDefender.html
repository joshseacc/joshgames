<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Science Defender: Chapter Select Edition</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050510;
            color: #00ffcc;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 50;
        }
        #main-menu {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.95);
            padding: 25px;
            border: 3px solid #00ffcc;
            border-radius: 20px;
            box-shadow: 0 0 25px #00ffcc;
            width: 85%;
            max-width: 450px;
            max-height: 90%;
            overflow-y: auto;
        }
        h1 {
            color: #00ffcc;
            text-shadow: 2px 2px 0px #ff00ff;
            margin-top: 0;
            font-size: 30px;
            margin-bottom: 10px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            background-color: #000;
            color: #ff00ff;
            border: 3px solid #ff00ff;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .menu-btn:active {
            background-color: #ff00ff;
            color: #000;
        }
        .mixed-btn {
            background-color: #ff00ff;
            color: #000;
            border-color: #00ffcc;
        }
        
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 130px;
            background-color: rgba(5, 5, 20, 1);
            border-bottom: 4px solid #00ffcc;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 30;
            box-shadow: 0 5px 15px rgba(0,255,204,0.3);
        }
        #hud {
            width: 90%;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            padding-top: 10px;
            color: #fff;
        }
        #question-display {
            width: 95%;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            margin-top: 15px;
        }
        
        #feedback-msg {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            font-size: 45px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0px 0px 15px #00ff00;
            display: none;
            z-index: 40;
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: none;
            justify-content: space-around;
            padding: 0 10px;
            box-sizing: border-box;
            pointer-events: auto;
            z-index: 20;
        }
        .ctrl-btn {
            background: rgba(0, 255, 255, 0.15);
            border: 2px solid #00ffff;
            color: #fff;
            font-size: 35px;
            padding: 15px 30px;
            border-radius: 12px;
            user-select: none;
            touch-action: none;
            flex: 1;
            margin: 0 10px;
        }
        .fire-btn {
            border-color: #ff00ff;
            background: rgba(255, 0, 255, 0.15);
            flex: 1.5;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="main-menu">
            <h1>Science Defender</h1>
            <p style="font-size:16px; color:#fff; margin-bottom: 15px;">Select a chapter to train!</p>
            <button class="menu-btn" onclick="startGame(1)">Ch 1: Living Things</button>
            <button class="menu-btn" onclick="startGame(2)">Ch 2: Animals</button>
            <button class="menu-btn" onclick="startGame(3)">Ch 3: Plants</button>
            <button class="menu-btn" onclick="startGame(4)">Ch 4: Environment (Focus!)</button>
            <button class="menu-btn mixed-btn" onclick="startGame('mixed')">MIXED MODE (ALL)</button>
        </div>

        <div id="game-over" style="display: none; pointer-events: auto; background: rgba(0,0,0,0.95); padding: 30px; border: 3px solid #ff0000; border-radius: 15px; width: 85%; max-width: 400px;">
            <h1 style="color: #ff0000;">Game Over</h1>
            <h2 id="final-score" style="color: #fff; font-size: 26px;">Score: 0</h2>
            <button class="menu-btn" style="border-color: #00ffcc; color: #00ffcc;" onclick="returnToMenu()">Menu</button>
        </div>
    </div>

    <div id="top-bar">
        <div id="hud">
            <span id="score-display">Score: 0</span>
            <span id="lives-display">Lives: 3</span>
        </div>
        <div id="question-display">Question goes here</div>
    </div>

    <div id="feedback-msg">CORRECT!</div>

    <div id="mobile-controls">
        <button class="ctrl-btn" id="btn-left">⬅️</button>
        <button class="ctrl-btn fire-btn" id="btn-fire">🔥 FIRE</button>
        <button class="ctrl-btn" id="btn-right">➡️</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('main-menu');
        const gameOverScreen = document.getElementById('game-over');
        const topBar = document.getElementById('top-bar');
        const questionDisplay = document.getElementById('question-display');
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const mobileControls = document.getElementById('mobile-controls');
        const feedbackMsg = document.getElementById('feedback-msg');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 重新分課的題庫，並確保 U4 (Environment) 有最多、最詳細的題目
        const questionsDB = {
            1: [
                { q: "What can living things do?", a: "Grow and reproduce", wrongs: ["Only move around", "Live forever"] },
                { q: "Are animals and plants living or non-living?", a: "Living things", wrongs: ["Non-living things", "Lifeless objects"] },
                { q: "Why is a robot dog a non-living thing?", a: "It cannot grow", wrongs: ["It cannot move", "It has life"] },
                { q: "Is a dinosaur fossil a living thing?", a: "No, it is lifeless", wrongs: ["Yes, it can grow", "Yes, it reproduces"] },
                { q: "Which one is a living thing?", a: "A dormant seed", wrongs: ["A falling rock", "A signpost"] },
                { q: "What is a main characteristic of living things?", a: "Respond to stimuli", wrongs: ["Never change", "Stay lifeless"] }
            ],
            2: [
                { q: "Why do animals need to eat food?", a: "To get energy", wrongs: ["To sleep better", "To change habitat"] },
                { q: "What happens if an animal skips meals?", a: "Feels weak and tired", wrongs: ["Gets more energy", "Grows faster"] },
                { q: "What does a honeybee mainly eat?", a: "Nectar from flowers", wrongs: ["Grass and leaves", "Small insects"] },
                { q: "What does an anteater mainly eat?", a: "Ants", wrongs: ["Meat", "Nectar"] },
                { q: "What does a squirrel mainly eat?", a: "Nuts", wrongs: ["Grass", "Meat"] },
                { q: "What does a lion mainly eat?", a: "Meat", wrongs: ["Grass", "Nectar"] },
                { q: "How does a snail protect itself?", a: "Hides in its shell", wrongs: ["Sprays dark ink", "Stings the enemy"] },
                { q: "How does a cuttlefish respond to danger?", a: "Sprays dark ink", wrongs: ["Hides in a shell", "Runs on land"] },
                { q: "How does a zebra protect itself?", a: "Runs away", wrongs: ["Hides in a shell", "Sprays ink"] },
                { q: "How does a wasp protect itself?", a: "Fights back / stings", wrongs: ["Hides in a shell", "Sprays ink"] },
                { q: "Why are tigers in forests losing their food?", a: "Forests are cut down", wrongs: ["They eat too much", "They don't like meat"] },
                { q: "What should you do if bees fly around you?", a: "Stay calm", wrongs: ["Wave hands", "Shout loudly"] }
            ],
            3: [
                { q: "What basic needs do plants require?", a: "Sunlight, air, water", wrongs: ["Meat, grass, nectar", "Bleach, detergent"] },
                { q: "Which part of a plant grows first?", a: "The root", wrongs: ["The stem", "The leaf"] },
                { q: "What is the main function of a plant's root?", a: "Anchors the plant", wrongs: ["Makes food", "Absorbs sunlight"] },
                { q: "What else does the root do?", a: "Absorbs water from soil", wrongs: ["Makes food", "Transports food"] },
                { q: "What is the function of a plant's stem?", a: "Transports water", wrongs: ["Anchors the plant", "Absorbs sunlight"] },
                { q: "What else does the stem do?", a: "Supports the plant", wrongs: ["Makes food", "Absorbs water from soil"] },
                { q: "What is the function of leaves?", a: "Absorbs sunlight to make food", wrongs: ["Absorbs water", "Transports nutrients"] },
                { q: "What happens if all leaves are cut off?", a: "The plant will die", wrongs: ["It grows faster", "Roots will make food"] },
                { q: "How do seedlings respond to light?", a: "Grow towards sunlight", wrongs: ["Grow away from light", "Hide in the soil"] },
                { q: "Why shouldn't we pick fallen leaves?", a: "They decay into nutrients", wrongs: ["They grow into new trees", "They absorb sunlight"] }
            ],
            4: [
                // U4 是最豐富的一課 (19 條題目)
                { q: "What does polluted water look like?", a: "Dirty and smelly", wrongs: ["Clear and no smell", "Freezing cold"] },
                { q: "What does clean water look like?", a: "Clear and no smell", wrongs: ["Dirty and smelly", "Grey and oily"] },
                { q: "Which items cause household water pollution?", a: "Detergent and bleach", wrongs: ["Fallen leaves", "Fresh rainwater"] },
                { q: "What else causes household water pollution?", a: "Grease and shampoo", wrongs: ["Sunlight and air", "Nectar and nuts"] },
                { q: "How does leaked fuel affect seabirds?", a: "Oil covers feathers", wrongs: ["Gives them energy", "Makes them fly faster"] },
                { q: "What health problem does polluted water cause?", a: "Intestinal diseases", wrongs: ["Coughing", "Blurred vision"] },
                { q: "What happens if rubbish blocks rivers?", a: "It affects ecology", wrongs: ["It makes water cleaner", "It gives fish food"] },
                { q: "What happens if waste water is poured into stormwater drains?", a: "Pollutes natural water", wrongs: ["Cleans the river", "Helps plants grow"] },
                { q: "What is a source of INDOOR air pollution?", a: "Smoking and cooking", wrongs: ["Factories and vehicles", "Hill fires"] },
                { q: "What is a source of OUTDOOR air pollution?", a: "Factories and vehicles", wrongs: ["Smoking indoors", "Bleach and shampoo"] },
                { q: "How does air pollution affect plants?", a: "Dust blocks sunlight", wrongs: ["Smells cover flower scent", "Helps make food"] },
                { q: "How does air pollution affect bees?", a: "Smells hide nectar scent", wrongs: ["Dust covers wings", "Makes them angry"] },
                { q: "How does grey sky affect drivers?", a: "Blurs vision", wrongs: ["Makes roads slippery", "Cars run out of fuel"] },
                { q: "What respiratory problems does air pollution cause?", a: "Coughing & breathing issues", wrongs: ["Intestinal diseases", "Stomach aches"] },
                { q: "When AQHI is 10+, who should stay indoors?", a: "Elderly and children", wrongs: ["Drivers and workers", "Only pets"] },
                { q: "What is a good habit to reduce air pollution?", a: "Walk for short distances", wrongs: ["Leave barbecue fires burning", "Smoke more"] },
                { q: "What is a good habit to reduce water pollution?", a: "Use eco-friendly detergent", wrongs: ["Pour oil down the sink", "Dump plastic in ocean"] },
                { q: "Why should we reduce plastic bottles?", a: "Making plastic releases bad gas", wrongs: ["They block sunlight", "They make the sky grey"] },
                { q: "Where should we put plastic bottles?", a: "Recycling bins", wrongs: ["Stormwater drains", "The ocean"] }
            ]
        };

        let isPlaying = false;
        let isTransitioning = false; 
        let score = 0;
        let lives = 3;
        let currentLevelPool = [];
        let currentQuestion = null;
        let currentMode = null;
        
        let playerSpeed = 7;
        let bulletSpeed = 10;
        let blockFallSpeed = 0.8; // 絕對恆定慢速
        let fireRate = 18; 
        let frameCount = 0;

        let player = { x: 0, y: 0, width: 50, height: 50, isFiring: false };
        let bullets = [];
        let blocks = [];
        let particles = [];

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        const bindButton = (id, keyName) => {
            const btn = document.getElementById(id);
            const press = (e) => { e.preventDefault(); keys[keyName] = true; };
            const release = (e) => { e.preventDefault(); keys[keyName] = false; };
            btn.addEventListener('touchstart', press);
            btn.addEventListener('touchend', release);
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        };
        bindButton('btn-left', 'ArrowLeft');
        bindButton('btn-right', 'ArrowRight');
        bindButton('btn-fire', ' '); 

        function startGame(mode) {
            currentMode = mode;
            score = 0;
            lives = 3;
            bullets = [];
            blocks = [];
            particles = [];
            
            // 根據所選按鈕準備題庫
            currentLevelPool = [];
            if (mode === 'mixed') {
                for (let i = 1; i <= 4; i++) {
                    currentLevelPool = currentLevelPool.concat([...questionsDB[i]]);
                }
            } else {
                currentLevelPool = [...questionsDB[mode]];
            }
            
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 140; 
            
            mainMenu.style.display = 'none';
            gameOverScreen.style.display = 'none';
            topBar.style.display = 'flex';
            mobileControls.style.display = 'flex';
            
            updateHUD();
            isTransitioning = false;
            loadNextQuestion();
            isPlaying = true;
            gameLoop();
        }

        function returnToMenu() {
            gameOverScreen.style.display = 'none';
            mobileControls.style.display = 'none';
            topBar.style.display = 'none';
            mainMenu.style.display = 'block';
        }

        function loadNextQuestion() {
            if (currentLevelPool.length === 0) {
                // 如果題目玩晒，自動重置題庫繼續玩
                if (currentMode === 'mixed') {
                    for (let i = 1; i <= 4; i++) {
                        currentLevelPool = currentLevelPool.concat([...questionsDB[i]]);
                    }
                } else {
                    currentLevelPool = [...questionsDB[currentMode]];
                }
            }
            const qIndex = Math.floor(Math.random() * currentLevelPool.length);
            currentQuestion = currentLevelPool.splice(qIndex, 1)[0]; 
            questionDisplay.innerText = currentQuestion.q;

            let answers = [{ text: currentQuestion.a, isCorrect: true }];
            let shuffledWrongs = [...currentQuestion.wrongs].sort(() => Math.random() - 0.5);
            answers.push({ text: shuffledWrongs[0], isCorrect: false });
            answers.push({ text: shuffledWrongs[1], isCorrect: false });
            answers.sort(() => Math.random() - 0.5); 

            blocks = [];
            const spacing = canvas.width / 3;
            const blockWidth = spacing * 0.9; 
            
            answers.forEach((ans, index) => {
                blocks.push({
                    x: (index * spacing) + (spacing - blockWidth) / 2,
                    y: 130, // 從擋板正下方開始
                    width: blockWidth,
                    height: 100, 
                    text: ans.text,
                    isCorrect: ans.isCorrect
                });
            });
            
            isTransitioning = false;
        }

        function updateHUD() {
            scoreDisplay.innerText = `Score: ${score}`;
            livesDisplay.innerText = `Lives: ${lives}`;
        }

        function handleCorrectAnswer() {
            isTransitioning = true;
            score += 10;
            updateHUD();
            
            // 瞬間清空畫面上所有子彈和方塊，防走火
            bullets = [];
            blocks = [];
            
            feedbackMsg.style.display = 'block';
            
            // 停頓 1.5 秒讓小朋友吸收成功感
            setTimeout(() => {
                feedbackMsg.style.display = 'none';
                loadNextQuestion();
            }, 1500);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    color: color
                });
            }
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function gameLoop() {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            ctx.fillStyle = '#ffffff';
            if(frameCount % 10 === 0) {
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
            }

            if (!isTransitioning) {
                if (keys['ArrowLeft'] || keys['a']) player.x -= playerSpeed;
                if (keys['ArrowRight'] || keys['d']) player.x += playerSpeed;
                if (keys[' '] || keys['ArrowUp']) player.isFiring = true;
                else player.isFiring = false;

                if (player.x < 0) player.x = 0;
                if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

                if (player.isFiring && frameCount % fireRate === 0) {
                    bullets.push({ x: player.x + player.width / 2 - 3, y: player.y, width: 6, height: 20 });
                }
            }

            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.fill();

            ctx.fillStyle = '#ff00ff';
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= bulletSpeed;
                ctx.fillRect(b.x, b.y, b.width, b.height);
                if (b.y < 0) bullets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, 5, 5);
                    ctx.globalAlpha = 1.0;
                }
            }

            if (!isTransitioning) {
                for (let i = blocks.length - 1; i >= 0; i--) {
                    let blk = blocks[i];
                    blk.y += blockFallSpeed;

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.fillRect(blk.x, blk.y, blk.width, blk.height);
                    ctx.strokeRect(blk.x, blk.y, blk.width, blk.height);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    wrapText(ctx, blk.text, blk.x + blk.width/2, blk.y + 25, blk.width - 10, 22);

                    if (blk.y > canvas.height) {
                        if (blk.isCorrect) {
                            lives--;
                            updateHUD();
                            blocks = []; 
                            if(lives > 0) setTimeout(loadNextQuestion, 500);
                        } else {
                            blocks.splice(i, 1); 
                        }
                        continue;
                    }

                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let b = bullets[j];
                        if (b.x < blk.x + blk.width && b.x + b.width > blk.x &&
                            b.y < blk.y + blk.height && b.y + b.height > blk.y) {
                            
                            bullets.splice(j, 1);
                            createExplosion(blk.x + blk.width/2, blk.y + blk.height/2, blk.isCorrect ? '#00ffff' : '#ff0000');
                            
                            if (blk.isCorrect) {
                                handleCorrectAnswer(); 
                            } else {
                                lives--;
                                updateHUD();
                                blocks.splice(i, 1); 
                            }
                            break;
                        }
                    }
                }
            }

            if (lives <= 0 && !isTransitioning) {
                isPlaying = false;
                topBar.style.display = 'none';
                mobileControls.style.display = 'none';
                feedbackMsg.style.display = 'none';
                gameOverScreen.style.display = 'block';
                finalScoreDisplay.innerText = `Score: ${score}`;
            }

            if (isPlaying) requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
